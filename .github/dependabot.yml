# Weekly dependency updates. Minor and patch bumps are grouped so the queue stays short;
# security updates always arrive on their own, as soon as GitHub has an advisory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
