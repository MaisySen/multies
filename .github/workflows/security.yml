# Static analysis and secret scanning on every push and pull request, plus weekly.
# Semgrep community edition and gitleaks need no account and run on private repos.
name: Security scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 0" # Mondays 06:17 in Sydney

permissions:
  contents: read

# A newer push supersedes an older scan on the same ref.
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  semgrep:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Review Z10: a version tag (the one the W4 scans ran), so a new Semgrep release cannot change what blocks a push.
      image: semgrep/semgrep:1.187.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # W4: ERROR findings block the push. Weak randomness that matters uses src/shared/random.ts; deliberate
      # exceptions carry "// nosemgrep: <rule id> (reason)". Paths left out: .semgrepignore.
      - name: Semgrep, blocking (ERROR findings)
        run: semgrep scan --metrics=off --severity ERROR --error --config p/owasp-top-ten --config p/typescript --config p/react --config p/nodejsscan --config p/secrets
      # The full scan (WARNING and INFO too) is reported, not enforced: printed in the log and kept as SARIF.
      - name: Semgrep, full report (does not fail the job)
        if: always()
        run: |
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/typescript --config p/react --config p/nodejsscan --config p/secrets --sarif-output=semgrep.sarif --text || true
      - name: Keep the full Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (committed secrets, whole history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
