name: CI
# Minutes: this repository is private on a free GitHub account (2,000 Linux minutes a month for
# all private repos). Every push runs only the fast checks the builders run locally before a push
# (npm ci, audit, tsc, eslint, copy check, Vale, unit tests). The slow half (build, Playwright E2E,
# Lighthouse) runs on pull requests, nightly, on demand, and whenever a deploy is asked for.
# QUAL1: on the 2 core runner a push costs about 25 minutes and a pull request or night 65 to 75 (check plus
# e2e), so the nightly run alone would use about all of the 2,000 minutes a month. Fewer nights, a public repo,
# a larger runner or shards are the owner's choice; the limits below only fit the measured times.
# Deploys are manual by default (Run workflow), because production is deployed by hand
# (docs/runbooks/deploy.md); set the repository variable AUTO_DEPLOY=true to deploy on every push.
on:
  push:
    branches: [main]
    # Docs only pushes skip CI; the copy check and Vale run locally before every push and again
    # on the next push that touches code.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".zap/**"
      - "brand/**"
  pull_request:
  schedule:
    - cron: "0 16 * * *" # 03:00 in Sydney (AEDT): the slow checks once a night
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to staging, then production, after the checks pass"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes an older run on the same ref. Deploy jobs keep their own queues below.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026 (runner-images issue 14748).
    runs-on: ubuntu-24.04
    # A hung runner step otherwise holds the queue for GitHub's six hour default. QUAL1: measured on 2 CPU cores
    # (the private runner's size, 11 November 2026): npm ci 21 s, typecheck 101 s (5.4 GB), lint 37 s, unit tests
    # with coverage 20 min, about 24 min in all. The limit is about 1.5 times that.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high or critical in shipped code, critical anywhere)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:copy
      - name: Vale (docs prose)
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz | tar xz vale
          ./vale $(git ls-files '*.md')
      - name: Unit and integration tests with coverage
        # QUAL1: four workers on the two cores. Most tests wait on timers and the database, so this took 20 min
        # (peak 2.6 GB) where vitest's default of one worker there would take about 38.
        run: npm run test:coverage -- --maxWorkers=4
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    # Slow checks: never on a plain push unless pushes deploy (AUTO_DEPLOY=true).
    if: github.event_name != 'push' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    # QUAL1: sized from a run on 2 CPU cores: build 1 min, Playwright 33 to 39 min with two workers (a tenth of the
    # suite took 3.9 min, peak 4.5 GB; scaled by count and by the full run's test times), Lighthouse up to 10.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:worker
      # The runner image already carries Chrome's system libraries, so only the browser is
      # downloaded. --with-deps went through a slow apt mirror and timed out twice.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # The connected mailbox spec skips itself here (no STALWART_TEST_* on the runner).
      # QUAL1: Playwright gives a two core runner one worker by default; two are set here (measured above).
      - name: End to end tests (Playwright)
        run: npm run test:e2e -- --workers=2
        timeout-minutes: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Lighthouse CI (performance, accessibility and best practice budgets)
        run: npm run lhci
        timeout-minutes: 10

  deploy-staging:
    needs: [check, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency: staging
    environment:
      name: staging
      url: https://mymail-staging.mymail-app.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: mymail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (release = commit)
        run: |
          echo "RELEASE=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          RELEASE=${GITHUB_SHA::12} npm run build:web
          RELEASE=${GITHUB_SHA::12} npm run build:worker
      - name: Sentry release and source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx --yes @sentry/cli@2 releases new "$RELEASE" -p mymail-api -p mymail-web
          npx --yes @sentry/cli@2 sourcemaps upload --release "$RELEASE" -p mymail-web dist/web/assets
          npx --yes @sentry/cli@2 sourcemaps upload --release "$RELEASE" -p mymail-api dist/worker/_worker.js dist/worker/_worker.js.map
      - name: Apply database migrations (staging)
        run: npx wrangler d1 migrations apply mymail-staging --remote --env staging
      # R58: keep the live release's /assets files beside the new ones, so a tab opened before the deploy still loads.
      - name: Carry the previous release's assets (staging)
        run: node scripts/carry-assets.mjs https://mymail-staging.mymail-app.workers.dev dist/worker/assets
      - name: Deploy to staging
        run: npx wrangler deploy --env staging --var RELEASE:$RELEASE
      - name: Smoke test staging
        run: scripts/smoke.sh https://mymail-staging.mymail-app.workers.dev "$RELEASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-build
          path: dist/
          # dist/worker/.assetsignore keeps the server bundle out of public assets; artifacts skip dotfiles by default.
          include-hidden-files: true
          retention-days: 7

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency: production
    environment:
      name: production
      url: https://mymail.mymail-app.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: mymail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The exact build that passed staging is promoted, never rebuilt.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worker-build
          path: dist/
      - run: echo "RELEASE=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Apply database migrations (idempotent, before the new code goes live)
        run: npx wrangler d1 migrations apply mymail-au --remote
      - name: Carry the previous release's assets (production)
        run: node scripts/carry-assets.mjs https://multies.si dist/worker/assets
      - name: Deploy the app (Workers + D1)
        run: |
          test -f dist/worker/.assetsignore || { echo "dist/worker/.assetsignore is missing from the promoted build"; exit 1; }
          npx wrangler deploy --env="" --var RELEASE:$RELEASE
      - name: Smoke test production
        run: scripts/smoke.sh https://mymail.mymail-app.workers.dev "$RELEASE"
      - name: Deploy the inbound email worker
        run: npx wrangler deploy --config email-worker/wrangler.toml
      - name: Mark the Sentry release deployed
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx --yes @sentry/cli@2 releases finalize "$RELEASE"
          npx --yes @sentry/cli@2 deploys new --release "$RELEASE" -e production
