name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:copy
      - name: Vale (docs prose)
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz | tar xz vale
          ./vale $(git ls-files '*.md')
      - run: npm test
      - run: npm run build && npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web && npm run build:worker
      - name: Apply database migrations (idempotent, before the new code goes live)
        run: npx wrangler d1 migrations apply mymail --remote
      - name: Deploy the app (Workers + D1)
        run: npx wrangler deploy
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://mymail.mymail-app.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Deploy the inbound email worker
        run: npx wrangler deploy --config email-worker/wrangler.toml
