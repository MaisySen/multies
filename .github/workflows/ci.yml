name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:copy
      - name: Vale (docs prose)
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz | tar xz vale
          ./vale README.md docs
      - run: npm test
      - run: npm run build && npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
