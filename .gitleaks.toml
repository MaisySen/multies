# gitleaks reads this file automatically. The default rules stay on.
[extend]
useDefault = true

# QUAL1: every entry below allows only the exact value gitleaks found (regexTarget "secret",
# anchored with ^ and $), never the whole line, so a real key added beside one of these
# values, or in place of one, is still reported. Each entry also names its files.

# The DKIM key generator (src/server/lib/crypto.ts) wraps a freshly generated key in PEM
# armour with a template string. What gitleaks takes for the key is the template itself,
# "${toB64(pkcs8)...}", which holds no key material.
[[allowlists]]
description = "PEM armour template in the DKIM key generator"
condition = "AND"
paths = ['^src/server/lib/crypto\.ts$']
regexTarget = "secret"
regexes = ['^-----BEGIN PRIVATE KEY-----\\n\$\{toB64\(pkcs8\)']

# Made up AI provider keys in the provider's shape: tests/ai.test.ts proves a workspace's
# own key is stored encrypted and never echoed, and the call recording (R23), write cost
# and later tests and specs reuse the same fakes (with a Groq shaped twin and an e2e
# variant). None is a credential for any service.
[[allowlists]]
description = "Made up AI keys in tests and specs"
condition = "AND"
paths = ['^tests/', '^e2e/']
regexTarget = "secret"
regexes = ['^sk-test-0123456789abcdefWXYZ$', '^gsk_test0123456789abcdefWXYZ$', '^sk-e2e-0123456789abcdefWXYZ$']

# R32: the web push tests use the published worked example from RFC 8291 Appendix A
# (public keys, private keys and auth secret printed in the RFC itself). They sign and
# decrypt nothing real.
[[allowlists]]
description = "RFC 8291 Appendix A example keys in the web push tests"
condition = "AND"
paths = ['^tests/web-push(-routes)?-r32\.test\.ts$']
regexTarget = "secret"
regexes = ['^yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw$', '^q1dXpw3UpT5VOmu_cf_v6ih07Aems3njxI-JWgLcM94$', '^BTBZMqHH6r4Tts7J_aSIgg$']

# QUAL1: R26 log masking test input. The token is built from {"alg":"HS256"},
# {"sub":"1234567890"} and the word "signature" twice; it signs nothing.
[[allowlists]]
description = "Made up token in the log masking test"
condition = "AND"
paths = ['^tests/secret-mask-r26\.test\.ts$']
regexTarget = "secret"
regexes = ['^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.c2lnbmF0dXJlc2lnbmF0dXJl$']

# QUAL1: phone app copy for Send securely. A message that contains the word "secret" makes
# the generic key rule take the next key's name ("m.compose3.secret_failed") for a key.
# Only names of that form are allowed; any other value on those lines is still reported.
[[allowlists]]
description = "Send securely string names in the phone app strings"
condition = "AND"
paths = ['^mobile/src/i18n/mpar3\.ts$']
regexTarget = "secret"
regexes = ['^m\.compose3\.secret_[a-z]+$']

# AIS1: tests/platform-mail-ais1.test.ts puts a made up value in mail from an outside sender
# and in Multies' own mail, to prove an agent reads the first and never the second, and
# tests/agent-identity-ais1.test.ts reuses it in a password reset link to an agent catch-all.
# It opens nothing. The tests arrive with the agent safety and agent identity branches; the
# entry is here because this file is rewritten on this branch and CI scans every branch.
[[allowlists]]
description = "Made up code in the platform mail and agent identity tests"
condition = "AND"
paths = ['^tests/platform-mail-ais1\.test\.ts$', '^tests/agent-identity-ais1\.test\.ts$']
regexTarget = "secret"
regexes = ['^Zq7mK2pX9wTr4LbN8cVd$']

# AIS1: tests/integration-wave1-ais1.test.ts puts a made up invite code in a link in Multies'
# own mail, to prove a key's task made from that mail keeps the text out of its notes. It
# opens nothing. The test arrives with the wave 1 integration branch; the entry is here for
# the same reason as the one above.
[[allowlists]]
description = "Made up invite code in the wave 1 integration test"
condition = "AND"
paths = ['^tests/integration-wave1-ais1\.test\.ts$']
regexTarget = "secret"
regexes = ['^Hq4nW8tZ2yLp6RxC3vBm$']

# Console mail tests on another branch plant connection secrets to prove list responses never
# echo them. CI scans every branch history, so the markers are allowlisted here by exact value.
[[allowlists]]
description = "Planted connection secrets in console mail tests"
condition = "AND"
paths = ['^tests/console-mail-routes\.test\.ts$', '^tests/console-mail-service\.test\.ts$']
regexTarget = "secret"
regexes = ['^PLANTED-ROUTE-CONN-SECRET-m7Hx2Rb6$', '^PLANTED-CONN-SECRET-n5Bv3$']
