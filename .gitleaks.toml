# gitleaks reads this file automatically. The default rules stay on.
[extend]
useDefault = true

# The DKIM key generator (src/server/lib/crypto.ts) wraps a freshly generated key in PEM
# armour with a template string. The line holds no key material, so it is allowed by
# path and pattern, which keeps working whatever commit id the line has.
[[allowlists]]
description = "PEM armour template in the DKIM key generator"
condition = "AND"
paths = ['src/server/lib/crypto\.ts']
regexTarget = "line"
regexes = ['-----BEGIN PRIVATE KEY-----\\n\$\{toB64']

# tests/ai.test.ts uses a made up AI provider key to prove the real one is stored encrypted
# and never echoed. It is not a credential for any service.
[[allowlists]]
description = "Made up AI key in the bring your own AI tests"
condition = "AND"
paths = ['tests/ai\.test\.ts']
regexTarget = "line"
regexes = ['const KEY = "sk-test-0123456789abcdefWXYZ"']
