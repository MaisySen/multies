# Australian hosting groundwork: MyMail, its mail server and backups on one Sydney VPS.
#
#   docker compose -f docker-compose.yml -f deploy/au/compose.au.yml up -d
#
# Adds, on top of the base file: Caddy in front of the app (HTTPS on 443 for the web app, with
# Stalwart's HTTPS moved to 8443), large attachments in an S3 bucket in Sydney, and nightly
# encrypted backups of both databases to the same region. See deploy/au/README.md.
services:
  stalwart:
    ports: !override
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "8443:443"

  mymail:
    environment:
      BODY_STORE_ENDPOINT: ${BODY_STORE_ENDPOINT:-https://s3.ap-southeast-2.amazonaws.com}
      BODY_STORE_REGION: ${BODY_STORE_REGION:-ap-southeast-2}
      BODY_STORE_BUCKET: ${BODY_STORE_BUCKET:?set BODY_STORE_BUCKET}
      BODY_STORE_ACCESS_KEY_ID: ${BODY_STORE_ACCESS_KEY_ID:?set BODY_STORE_ACCESS_KEY_ID}
      BODY_STORE_SECRET_ACCESS_KEY: ${BODY_STORE_SECRET_ACCESS_KEY:?set BODY_STORE_SECRET_ACCESS_KEY}
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST, for example app.example.com.au}
    volumes:
      - ./deploy/au/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [mymail]

  backup:
    image: restic/restic:0.17.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY, for example s3:s3.ap-southeast-2.amazonaws.com/mymail-au-backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:?set BACKUP_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:?set BACKUP_SECRET_ACCESS_KEY}
    volumes:
      - ./deploy/au/backup.sh:/backup.sh:ro
      - mymail-data:/data/mymail:ro
      - stalwart-data:/data/stalwart:ro

volumes:
  caddy-data:
