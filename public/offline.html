<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>You are offline · Multies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f5f5f7; --card: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: rgba(0, 0, 0, 0.08); --accent: #0071e3; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0d; --card: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --line: rgba(255, 255, 255, 0.1); --accent: #2997ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 24px; }
      main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px 28px 28px; text-align: center; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06); }
      svg { width: 44px; height: 44px; color: var(--muted); }
      h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 16px 0 6px; }
      p { margin: 0; color: var(--muted); }
      a { display: inline-flex; align-items: center; justify-content: center; margin-top: 22px; height: 36px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 500; font-size: 14px; }
      a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
      footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main role="main" aria-labelledby="t">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" /><path d="M19 12.86a10 10 0 0 0-2-1.54" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" /><path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" /></svg>
      <h1 id="t">You are offline</h1>
      <p>Multies opens again as soon as this device is back online.</p>
      <a href="/app">Try again</a>
      <footer>Multies by Fintex Australia Pty Ltd</footer>
    </main>
  </body>
</html>
