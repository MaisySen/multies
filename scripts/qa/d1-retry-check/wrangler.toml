# R29: checks the R28 D1 read retry (src/server/lib/d1-busy.ts) against the real D1 binding in workerd
# (wrangler dev, local D1; nothing remote). Run: node scripts/qa/d1-retry-check/run.mjs
name = "d1-retry-check"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "d1-retry-check"
database_id = "00000000-0000-0000-0000-000000000000"
