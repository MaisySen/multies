# Local ZAP baseline: TARGET=https://... REPORT_DIR=/tmp/zap zap.sh -cmd -autorun .zap/plan.yaml

env:
  contexts:
    - name: mymail
      urls: ["${TARGET}"]
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
  - type: spider
    parameters:
      context: mymail
      maxDuration: 2
  - type: spiderAjax
    parameters:
      context: mymail
      maxDuration: 3
      browserId: htmlunit
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: report
    parameters:
      template: traditional-json
      reportDir: ${REPORT_DIR}
      reportFile: zap-report
  - type: report
    parameters:
      template: traditional-md
      reportDir: ${REPORT_DIR}
      reportFile: zap-report
