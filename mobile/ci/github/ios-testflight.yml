# iOS TestFlight upload for the Multies Expo app (mobile/ folder).
# Adapted from the Fintex publishing playbook, section 3.9.
#
# Where this file goes: GitHub only runs workflows from .github/workflows/ at the repo root.
# Copy it to .github/workflows/ios-testflight.yml in the repo that will run it:
#   - MaisySen/multies (private): the folder is mobile/, as below. macOS minutes are billed on a
#     private repo, so this route costs money once the free minutes run out.
#   - A new public repo holding only the mobile app: set APP_DIR to "." (free macOS minutes,
#     but the app code is public). Check history for secrets first (docs/SECURITY.md).
# Repository secrets needed: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (docs/STORE.md).
name: iOS TestFlight upload

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (empty means 100 plus the run number)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

env:
  APP_DIR: mobile
  SCHEME: Multies

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "Missing repository secret $v"; exit 1; fi
          done

      - name: Pick Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install and prebuild iOS
        timeout-minutes: 30
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npx expo prebuild --platform ios --clean > ../prebuild.log 2>&1 || { tail -60 ../prebuild.log; exit 1; }
          ls ios

      - name: Set build number
        working-directory: ${{ env.APP_DIR }}
        run: |
          BUILD="${{ inputs.build }}"
          if [ -z "$BUILD" ]; then BUILD=$((100 + ${{ github.run_number }})); fi
          echo "Build number $BUILD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "ios/$SCHEME/Info.plist"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: API key file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (signed)
        timeout-minutes: 50
        working-directory: ${{ env.APP_DIR }}/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$GITHUB_WORKSPACE/archive.log" 2>&1 || { grep -E "error:" "$GITHUB_WORKSPACE/archive.log" | sort -u | head -60; exit 1; }

      - name: Upload to TestFlight
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -E "error|Error" export.log | sort -u | head -60; exit 1; }
          grep -E "Upload succeeded|EXPORT SUCCEEDED|Uploaded" export.log || tail -20 export.log

      - name: Clean up the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
