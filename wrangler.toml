DOC_ENGINE_KEY_ID = "stg-1"
# R43b: imports carry on after their page closes (the upload is kept, the 15 minute pass finishes it and sends one
# done email). Proven on production 27 Oct 2026. Set to "false" to go back to "keep this page open".
BACKGROUND_COPY = "true"
VAPID_PUBLIC_KEY = "BF_cIsJn0Z-3EUSVQQMet8dFzCp6t0v_1CqHoFoM9rMO7GAU76vlb0p_06bmxw97YmUtE-Oyh-7keouK-D98qYo"
SCHEDULING_ENABLED = "true"
