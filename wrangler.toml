# Multies on Cloudflare Workers + D1, in two environments:
#
#   production  (top level)      https://multies.si (also app.multies.si and https://mymail.mymail-app.workers.dev)
#   staging     ([env.staging])  https://preview.multies.si (also https://mymail-staging.mymail-app.workers.dev), noindex
#
# CI (.github/workflows/ci.yml) deploys every push to main to staging first, runs the
# smoke checks there, and only then promotes the same build to production.
# Manual deploy (see docs/runbooks/release.md):
#   npm run build:web && npm run build:worker
#   npx wrangler d1 migrations apply mymail-staging --remote --env staging && npx wrangler deploy --env staging
#   npx wrangler d1 migrations apply mymail-au --remote && npx wrangler deploy
# Secrets live in Cloudflare, never in this file (per environment: add --env staging):
#   npx wrangler secret put APP_SECRET        # 32+ random chars (required)
#   npx wrangler secret put RESEND_API_KEY    # outbound mail
#   npx wrangler secret put SENTRY_DSN_API    # error tracking (API)
#   npx wrangler secret put SENTRY_DSN_WEB    # error tracking (browser)
#   npx wrangler secret put STRIPE_SECRET_KEY # billing
#   npx wrangler secret put AUTH0_CLIENT_SECRET (plus AUTH0_DOMAIN and AUTH0_CLIENT_ID)
#   npx wrangler secret put CF_ANALYTICS_TOKEN # Account Analytics: Read only; turns on the D1 write budget guard
# docs/security/secrets-rotation.md lists every secret and how to rotate it.
name = "mymail"
main = "dist/worker/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

# Run the Worker in Sydney, next to the D1 primary (both databases are in Oceania), so a
# request crosses the Pacific once instead of once per query. Smart Placement never moved
# this Worker (responses kept saying local-SEA or local-PDX), so a demo from the US made
# about 300 Pacific round trips. Targeted placement was checked on a throwaway Worker on
# 2026-10-23: it answered from remote-SYD. Inherited by staging.
[placement]
mode = "targeted"
region = "aws:ap-southeast-2"

[assets]
directory = "dist/worker"
binding = "ASSETS"
not_found_handling = "none"
# robots.txt goes through the Worker so a NOINDEX host (the preview) can answer Disallow: /.
run_worker_first = ["/api/*", "/.well-known/*", "/robots.txt"]

# No Workers AI binding: Multies never pays for AI model calls. The assistant runs on each
# workspace's own API key (bring your own AI), and agents connect through MCP.

[[d1_databases]]
binding = "DB"
# Created in Oceania (location hint "oc") on 2026-10-23 and filled from an export of the
# first production database, which sat in western North America so every query from an
# Australian visitor crossed the Pacific. The old one ("mymail") is kept until 2026-10-30.
database_name = "mymail-au"
database_id = "e467919b-f7d8-4961-86b9-9cd861708efc"
# Migrations run once per deploy, before the new code goes live:
#   npx wrangler d1 migrations apply mymail-au --remote
migrations_dir = "drizzle"
migrations_table = "d1_migrations"

# Doc co-editing rooms: one Durable Object per doc (src/server/collab/durable-object.ts),
# SQLite storage backend, which the Workers Free plan includes. Not inherited by envs,
# so staging declares its own below.
[[durable_objects.bindings]]
name = "DOC_ROOMS"
class_name = "DocRoom"

# Connected mailbox sync: one object per connection, so each sync pass is its own invocation
# (src/entry/worker.ts MailSyncRunner). SQLite backend, on the Free plan like DocRoom.
[[durable_objects.bindings]]
name = "MAIL_SYNC"
class_name = "MailSyncRunner"

# Round 22: who is viewing or replying in a shared inbox thread (src/server/collab/thread-presence.ts).
# One object per org and thread, memory only: a heartbeat writes neither storage nor D1.
[[durable_objects.bindings]]
name = "THREAD_PRESENCE"
class_name = "ThreadPresence"

[[migrations]]
tag = "v1-doc-rooms"
new_sqlite_classes = ["DocRoom"]

[[migrations]]
tag = "v2-mail-sync"
new_sqlite_classes = ["MailSyncRunner"]

[[migrations]]
tag = "v3-thread-presence"
new_sqlite_classes = ["ThreadPresence"]

# Edge rate limits (Workers rate limiting API). Without these bindings the app
# falls back to a shared counter in D1. Limits match src/server/lib/rate-limit.ts.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_WEBHOOKS"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_APP"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

[vars]
APP_MODE = "production"
# Public booking pages and the scheduling API (migration 0021).
SCHEDULING_ENABLED = "true"
# The app's public address. The workers.dev address keeps working (same Worker, same data);
# www.multies.si redirects to the apex and app.multies.si serves the app too.
APP_URL = "https://multies.si"
DEMO_MODE = "true"
SENTRY_ENVIRONMENT = "production"
SENTRY_TRACES_SAMPLE_RATE = "0.1"
SECURITY_CONTACT = "mailto:security@multies.si"
# Support address on /support and in the store listings (Cloudflare Email Routing on multies.si).
SUPPORT_EMAIL = "support@multies.si"
# Free personal addresses (name@mail.multies.si), docs/runbooks/free-addresses.md. Never the root
# multies.si: that is the company's own domain, for staff addresses only (owner decision, 25 Oct 2026).
FREE_MAIL_DOMAIN = "mail.multies.si"
FREE_MAIL_DAILY_SENDS = "50"
# The App Review login's demo workspace (scripts/review-account.ts), kept from the demo purge.
KEEP_DEMO_ORG_IDS = "org_b0kb5ykvrto8w0rm"
# At most this many new demo workspaces a day. Each costs about 2,000 D1 rows over its life
# (about 1,000 to create and seed, about as many for the purge a day later; D1 counts every
# index), so 10 is at most about 20% of the daily budget (tests/write-cost.test.ts).
DEMO_DAILY_LIMIT = "10"
# D1 daily write budget guard (src/server/services/write-budget.ts, docs/runbooks/d1-daily-limits.md).
# Reads the account's rows written today from Cloudflare analytics with the CF_ANALYTICS_TOKEN secret
# (no database writes). Alerts from 60%; from 80% new demo workspaces wait until 00:00 UTC.
CF_ACCOUNT_ID = "84058c44c33b60521d2bb03c36dc0881"
D1_DAILY_WRITE_BUDGET = "100000"
BILLING_GRACE_DAYS = "7"
# Cross checks: production watches staging (the preview) (src/server/services/status.ts).
MONITOR_URLS = "https://mymail-staging.mymail-app.workers.dev"
# Same account workers.dev fetches answer 404 (error 1042), so the peer goes through a service binding.
PEER_HOST = "mymail-staging.mymail-app.workers.dev"

[[services]]
binding = "PEER"
service = "mymail-staging"

# Workers Logs: the JSON log lines are indexed and searchable in the dashboard.
[observability]
enabled = true
head_sampling_rate = 1

# Housekeeping, job queue, uptime self check: every 15 minutes (each pass costs database writes,
# and the account shares one daily write budget across production and staging).
[triggers]
crons = ["*/15 * * * *"]

# ------------------------------------------------------------------ staging
[env.staging]
name = "mymail-staging"
workers_dev = true
# The public preview of current main. NOINDEX keeps it out of search engines.
routes = [{ pattern = "preview.multies.si", custom_domain = true }]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mymail-staging"
database_id = "72494627-4880-4fb9-9586-e2175f16e8d3"
migrations_dir = "drizzle"
migrations_table = "d1_migrations"

[[env.staging.durable_objects.bindings]]
name = "DOC_ROOMS"
class_name = "DocRoom"

[[env.staging.durable_objects.bindings]]
name = "MAIL_SYNC"
class_name = "MailSyncRunner"

[[env.staging.durable_objects.bindings]]
name = "THREAD_PRESENCE"
class_name = "ThreadPresence"

[[env.staging.migrations]]
tag = "v1-doc-rooms"
new_sqlite_classes = ["DocRoom"]

[[env.staging.migrations]]
tag = "v2-mail-sync"
new_sqlite_classes = ["MailSyncRunner"]

[[env.staging.migrations]]
tag = "v3-thread-presence"
new_sqlite_classes = ["ThreadPresence"]

[[env.staging.ratelimits]]
name = "RL_AUTH"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "RL_API"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

[[env.staging.ratelimits]]
name = "RL_WEBHOOKS"
namespace_id = "2003"
simple = { limit = 600, period = 60 }

[[env.staging.ratelimits]]
name = "RL_APP"
namespace_id = "2004"
simple = { limit = 300, period = 60 }

[env.staging.vars]
SCHEDULING_ENABLED = "true"
APP_MODE = "production"
APP_URL = "https://preview.multies.si"
NOINDEX = "true"
DEMO_DAILY_LIMIT = "2"
# Staging spends production's daily D1 budget (same account). Strict: from 60% of the budget its API
# answers writes with the read only message, so tests here can never take production read only.
CF_ACCOUNT_ID = "84058c44c33b60521d2bb03c36dc0881"
D1_DAILY_WRITE_BUDGET = "100000"
WRITE_BUDGET_GUARD = "strict"
DEMO_MODE = "true"
SENTRY_ENVIRONMENT = "staging"
SENTRY_TRACES_SAMPLE_RATE = "1"
SECURITY_CONTACT = "mailto:security@multies.si"
# Support address on /support and in the store listings (Cloudflare Email Routing on multies.si).
SUPPORT_EMAIL = "support@multies.si"
# The App Review login's demo workspace (scripts/review-account.ts), kept from the demo purge.
KEEP_DEMO_ORG_IDS = "org_xqswgcz3cvizpiel"
BILLING_GRACE_DAYS = "7"
# Staging watches production, through a service binding (see PEER above).
MONITOR_URLS = "https://mymail.mymail-app.workers.dev"
PEER_HOST = "mymail.mymail-app.workers.dev"

[[env.staging.services]]
binding = "PEER"
service = "mymail"

[env.staging.observability]
enabled = true

# Hourly on staging: nobody depends on its queue, and each pass writes.
[env.staging.triggers]
crons = ["0 * * * *"]
