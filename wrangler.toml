# CAMPAIGN_SEND_ALLOW_EXTRA secret, is added to this list. Never real people from staging.
CAMPAIGN_SEND_ALLOW = "@staging-qa.invalid"
HELP_CENTER = "on" # R122: help center
DAV_SYNC_R99 = "on" # R99: calendar and contacts sync (staging)
# ANALYTICS-PH: internal product usage analytics (POSTHOG_KEY and ANALYTICS_HASH_KEY are secrets; the client workspace is always excluded).
ANALYTICS_PH = "on"
POSTHOG_HOST = "https://eu.i.posthog.com"
DASHBOARDS_PLUS = "on" # R91
# R118: the test network for compose, schedule, approve, inbox and analytics checks (refused on multies.si by code).
SOCIAL_TEST_NETWORK = "on"
DOCS_PLUS_R103 = "on" # R103: Docs plus (link library, web clipper, doc comments, spell check)
TIKTOK_SCOPES = "user.info.basic,video.upload,video.publish"
# Tools P1: document tools on staging, through the document engine with the staging key id.
TOOLS_ENABLED = "true"
# Tools P2 features (src/shared/tool-features.ts): "all" on staging, only shipped ones on production.
